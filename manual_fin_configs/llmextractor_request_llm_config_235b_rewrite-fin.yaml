    device: cuda:0
    shortest_path_k: 4
    debug: True
    merge_num: 5
    overlap: 100
    embedder: /root/search-agent/models/Fin-Retriever-base/
    tokenizer: /root/search-agent/models/Fin-Retriever-base/
