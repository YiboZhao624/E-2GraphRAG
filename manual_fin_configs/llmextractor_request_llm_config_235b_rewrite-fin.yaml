  chat_mode: chat
  api_headers:
    Authorization: Bearer YOUR_API_KEY
    Content-Type: application/json
  request_kwargs:
    timeout: 120
  batch_size: 4

paths:
  log_path: ./log/llm_extractor_235b_rewrite
