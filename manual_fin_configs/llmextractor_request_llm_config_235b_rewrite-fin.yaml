dataset:
  dataset_name: bank
  dataset_path: ./data/

split_method: manual

llm:
  type: requests
  llm_name: qwen3-235b-a22b
  llm_path: null
  tokenizer_name: /mnt/shared-storage-gpfs2/gpfs2-shared-public/huggingface/hub/models--Qwen--Qwen3-235B-A22B/snapshots/8efa61729e24bd65b1d152b5ab5409052aa80e65
  llm_device: cuda:0
  max_new_tokens: 1200
  temperature: 0.7
  top_p: 0.9
